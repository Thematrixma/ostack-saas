<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التسجيل | بوصلة الشخصية</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="disclaimer-bar">
  هذا الاختبار للتطوير الذاتي وفهم السلوك، ولا يعتبر تشخيصًا نفسيًا أو طبيًا.
</div>

<header class="site-header">
  <div class="container">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" stroke="#c9a24b" stroke-width="2"/>
        <path d="M20 8 L24 20 L20 32 L16 20 Z" fill="#c9a24b"/>
      </svg>
      بوصلة الشخصية
    </div>
    <nav class="site-nav">
      <a href="index.html">الرئيسية</a>
    </nav>
  </div>
</header>

<main class="form-page">
  <div class="container" style="max-width:560px;">

    <div class="summary-box">
      <h3>الباقة المختارة</h3>
      <div class="summary-row"><strong>الاسم</strong> <span id="pkg-name">—</span></div>
      <div class="summary-row"><strong>السعر</strong> <span id="pkg-price">—</span></div>
    </div>

    <div class="form-card">
      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="full-name">الاسم الكامل</label>
          <input type="text" id="full-name" required>
          <div class="field-error">يرجى إدخال الاسم الكامل</div>
        </div>
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" required>
          <div class="field-error">يرجى إدخال بريد إلكتروني صحيح</div>
        </div>
        <div class="form-group">
          <label for="phone">رقم الجوال</label>
          <input type="tel" id="phone" required placeholder="05xxxxxxxx">
          <div class="field-error">يرجى إدخال رقم جوال صحيح</div>
        </div>
        <div class="form-group">
          <label for="age">العمر (اختياري)</label>
          <input type="number" id="age" min="10" max="100">
        </div>
        <button type="submit" class="btn btn-primary btn-block">المتابعة إلى الدفع</button>
      </form>
    </div>

  </div>
</main>

<footer class="site-footer">
  <div class="container">© بوصلة الشخصية — جميع الحقوق محفوظة.</div>
</footer>

<script src="app.js"></script>
<script>
  const selectedPkgId = readFromStorage(STORAGE_KEYS.selectedPackage);
  const pkg = PACKAGES[selectedPkgId];

  if (!pkg) {
    window.location.href = "index.html";
  } else {
    document.getElementById('pkg-name').textContent = pkg.name;
    document.getElementById('pkg-price').textContent = pkg.price + ' ريال';
  }

  document.getElementById('register-form').addEventListener('submit', function (e) {
    e.preventDefault();

    const fullName = document.getElementById('full-name');
    const email = document.getElementById('email');
    const phone = document.getElementById('phone');
    const age = document.getElementById('age');

    let valid = true;
    [fullName, email, phone].forEach(f => f.nextElementSibling.style.display = 'none');

    if (fullName.value.trim().length < 3) {
      fullName.nextElementSibling.style.display = 'block';
      valid = false;
    }
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email.value.trim())) {
      email.nextElementSibling.style.display = 'block';
      valid = false;
    }
    const phonePattern = /^05\d{8}$/;
    if (!phonePattern.test(phone.value.trim())) {
      phone.nextElementSibling.style.display = 'block';
      valid = false;
    }

    if (!valid) return;

    const customer = {
      fullName: fullName.value.trim(),
      email: email.value.trim(),
      phone: phone.value.trim(),
      age: age.value ? Number(age.value) : null
    };

    saveToStorage(STORAGE_KEYS.customer, customer);
    window.location.href = "payment.html";
  });
</script>
</body>
</html>
