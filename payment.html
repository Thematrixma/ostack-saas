<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدفع | بوصلة الشخصية</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="disclaimer-bar">
  هذا الاختبار للتطوير الذاتي وفهم السلوك، ولا يعتبر تشخيصًا نفسيًا أو طبيًا.
</div>

<header class="site-header">
  <div class="container">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" stroke="#c9a24b" stroke-width="2"/>
        <path d="M20 8 L24 20 L20 32 L16 20 Z" fill="#c9a24b"/>
      </svg>
      بوصلة الشخصية
    </div>
    <nav class="site-nav">
      <a href="index.html">الرئيسية</a>
    </nav>
  </div>
</header>

<main class="form-page">
  <div class="container" style="max-width:560px;">

    <div class="summary-box">
      <h3>ملخص الطلب</h3>
      <div class="summary-row"><strong>الباقة</strong> <span id="o-pkg">—</span></div>
      <div class="summary-row"><strong>السعر</strong> <span id="o-price">—</span></div>
      <div class="summary-row"><strong>الاسم</strong> <span id="o-name">—</span></div>
      <div class="summary-row"><strong>البريد</strong> <span id="o-email">—</span></div>
      <div class="summary-row"><strong>الجوال</strong> <span id="o-phone">—</span></div>
    </div>

    <div class="form-card">
      <h3 style="margin-top:0;color:var(--green-dark);">طريقة الدفع</h3>
      <div class="pay-methods">
        <label class="pay-method" data-method="card">
          <input type="radio" name="pay-method" value="card" checked>
          <span class="pm-label">بطاقة مدى / فيزا / ماستركارد</span>
        </label>
        <label class="pay-method" data-method="applepay">
          <input type="radio" name="pay-method" value="applepay">
          <span class="pm-label">Apple Pay</span>
        </label>
        <label class="pay-method" data-method="bank">
          <input type="radio" name="pay-method" value="bank">
          <span class="pm-label">تحويل بنكي</span>
        </label>
      </div>

      <button id="pay-btn" class="btn btn-primary btn-block">إتمام الدفع</button>
      <p style="text-align:center;font-size:.8rem;color:var(--text-muted);margin-top:14px;">
        هذه عملية دفع تجريبية للعرض فقط — جاهزة للربط لاحقًا ببوابة دفع حقيقية.
      </p>
    </div>

  </div>
</main>

<footer class="site-footer">
  <div class="container">© بوصلة الشخصية — جميع الحقوق محفوظة.</div>
</footer>

<script src="app.js"></script>
<script>
  const pkgId = readFromStorage(STORAGE_KEYS.selectedPackage);
  const pkg = PACKAGES[pkgId];
  const customer = readFromStorage(STORAGE_KEYS.customer);

  if (!pkg || !customer) {
    window.location.href = buildUrl('index.html', {});
  } else {
    document.getElementById('o-pkg').textContent = pkg.name;
    document.getElementById('o-price').textContent = pkg.price + ' ريال';
    document.getElementById('o-name').textContent = customer.fullName;
    document.getElementById('o-email').textContent = customer.email;
    document.getElementById('o-phone').textContent = customer.phone;
  }

  document.querySelectorAll('.pay-method').forEach(label => {
    label.addEventListener('click', () => {
      document.querySelectorAll('.pay-method').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
    });
  });
  document.querySelector('.pay-method').classList.add('selected');

  document.getElementById('pay-btn').addEventListener('click', function () {
    const method = document.querySelector('input[name="pay-method"]:checked').value;

    /* TODO: ربط لاحق مع Moyasar / Tap / Paylink - راجع PAYMENT_GATEWAY_NOTE في app.js */
    const paymentData = {
      status: 'paid_demo',
      method,
      package: pkgId,
      amount: pkg.price,
      date: new Date().toISOString()
    };
    saveToStorage(STORAGE_KEYS.payment, paymentData);

    sendToGoogleSheets({
      name: customer.fullName,
      email: customer.email,
      phone: customer.phone,
      age: customer.age,
      package: pkg.name,
      price: pkg.price,
      date: new Date().toISOString()
    });

    const custParam = encodeURIComponent(JSON.stringify(customer));
    window.location.href = buildUrl('test.html', { pkg: pkgId, cust: custParam, paid: method });
  });
</script>
</body>
</html>
