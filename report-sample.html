<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نموذج تقرير | بوصلة الشخصية</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="report-page">

<header class="site-header no-print">
  <div class="container">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" stroke="#c9a24b" stroke-width="2"/>
        <path d="M20 8 L24 20 L20 32 L16 20 Z" fill="#c9a24b"/>
      </svg>
      بوصلة الشخصية
    </div>
    <nav class="site-nav">
      <a href="index.html">الرئيسية</a>
    </nav>
  </div>
</header>

<main>
  <div class="container" style="max-width:760px;">
    <div id="report-content"></div>

    <div class="report-actions no-print">
      <button class="btn btn-primary btn-block" onclick="window.print()">تحميل نموذج PDF</button>
      <a href="index.html#pricing" class="btn btn-outline btn-block">احصل على تقريرك الكامل</a>
    </div>

    <div class="notice-box no-print">
      هذا نموذج عرض فقط، وليس تقريرًا فعليًا. التقرير الحقيقي يُبنى على إجاباتك في الاختبار.
    </div>
  </div>
</main>

<footer class="site-footer no-print">
  <div class="container">© بوصلة الشخصية — جميع الحقوق محفوظة.</div>
</footer>

<script src="app.js"></script>
<script>
  const primary = 'I';
  const secondary = 'D';
  const samplePercentages = { D: 65, I: 80, S: 35, C: 50 };
  const pPrimary = PATTERN_CONTENT[primary];
  const pSecondary = PATTERN_CONTENT[secondary];

  let html = `
    <div class="report-cover">
      <h1>تقرير DISC المتقدم — نموذج عرض</h1>
      <p>إعداد خاص لـ: عميل تجريبي</p>
      <div class="result-pattern">${primary}${secondary}</div>
      <p>${DISC_INFO[primary].name} + ${DISC_INFO[secondary].name}</p>
    </div>

    <div class="report-section">
      <h2>درجات النمط</h2>
      <div id="radar-box"></div>
      <div class="disc-bars">
        ${['D','I','S','C'].map(k => `
          <div class="disc-bar-row">
            <div class="disc-bar-label"><span>${k} - ${DISC_INFO[k].name}</span><span>${samplePercentages[k]}%</span></div>
            <div class="disc-bar-track"><div class="disc-bar-fill fill-${k}" style="width:${samplePercentages[k]}%"></div></div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="report-section">
      <h2>ملخص الشخصية</h2>
      <p>${pPrimary.summary}</p>
      <p>${getCompoundExplanation(primary, secondary)}</p>
    </div>

    <div class="report-section">
      <h2>نقاط القوة</h2>
      <ul>${pPrimary.strengths.map(s => `<li>${s}</li>`).join('')}</ul>
    </div>

    <div class="locked-section">
      🔒 بقية التقرير (التحديات، أسلوب العمل، خطة 30 يوم، الخريطة السلوكية الكاملة) تظهر بالكامل في تقريرك الشخصي بعد إتمام الاختبار.
    </div>
  `;

  document.getElementById('report-content').innerHTML = html;
  renderRadarChart('radar-box', samplePercentages);
</script>
</body>
</html>
